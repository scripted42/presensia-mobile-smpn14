<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="195" y1="0" x2="195" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="35%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Gold Podium Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Silver Podium Gradient -->
    <linearGradient id="silverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Bronze Podium Gradient -->
    <linearGradient id="bronzeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="50%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- Blue Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#023C69" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10" y="-5" width="410" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.05" />
    </filter>

    <!-- Podium Shadow -->
    <filter id="podiumShadow" x="0" y="0" width="390" height="280" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="390" height="844" rx="40" fill="url(#bgGrad)" />

  <!-- Status Bar Area -->
  <g id="StatusBar">
    <text x="32" y="38" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A">09:41</text>
    <circle cx="330" cy="34" r="3" fill="#0F172A" />
    <circle cx="340" cy="34" r="3" fill="#0F172A" />
    <rect x="350" y="28" width="20" height="12" rx="3" fill="none" stroke="#0F172A" stroke-width="2" />
    <rect x="352" y="30" width="12" height="8" rx="1.5" fill="#0F172A" />
  </g>

  <!-- Top App Bar -->
  <g id="TopAppBar">
    <rect x="20" y="56" width="40" height="40" rx="12" fill="#FFFFFF" filter="url(#cardShadow)" />
    <!-- Back Icon -->
    <path d="M43 76L37 76M37 76L41 72M37 76L41 80" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="75" y="74" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Peringkat Disiplin</text>
    <text x="75" y="90" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B">SMP Negeri 14 Surabaya</text>

    <!-- Info/Filter Icon -->
    <rect x="330" y="56" width="40" height="40" rx="12" fill="#FFFFFF" filter="url(#cardShadow)" />
    <circle cx="350" cy="76" r="8" fill="none" stroke="#2563EB" stroke-width="2" />
    <text x="348" y="80" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#2563EB">i</text>
  </g>

  <!-- Segmented Switcher (Tab) -->
  <g id="SegmentedTabs">
    <rect x="20" y="112" width="350" height="44" rx="22" fill="#E2E8F0" />
    
    <!-- Active Tab: Peringkat Kelas -->
    <rect x="24" y="116" width="170" height="36" rx="18" fill="#FFFFFF" filter="url(#cardShadow)" />
    <text x="109" y="139" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#023C69">🏆 Peringkat Kelas</text>

    <!-- Inactive Tab: Top Siswa -->
    <text x="275" y="139" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#64748B">Top Siswa</text>
  </g>

  <!-- 3D PODIUM SECTION -->
  <g id="PodiumSection" filter="url(#podiumShadow)">
    <!-- 2nd Place Podium (Left - Silver) -->
    <g id="PodiumSilver">
      <rect x="30" y="235" width="105" height="120" rx="16" fill="url(#silverGrad)" />
      <!-- Top Cap Highlight -->
      <path d="M30 245 C30 239, 34 235, 40 235 L125 235 C131 235, 135 239, 135 245 L135 250 L30 250 Z" fill="#FFFFFF" opacity="0.4" />
      <text x="82" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" opacity="0.6">2</text>
      
      <!-- Silver Trophy Cup -->
      <g transform="translate(62, 185)">
        <ellipse cx="20" cy="28" rx="10" ry="3" fill="#64748B" opacity="0.3" />
        <path d="M12 28L28 28M20 20L20 28M10 8C10 16 16 20 20 20C24 20 30 16 30 8H10Z" fill="#94A3B8" stroke="#475569" stroke-width="2" />
        <path d="M10 11H6C5 11 4 13 4 14C4 17 8 18 10 18" stroke="#475569" stroke-width="2" />
        <path d="M30 11H34C35 11 36 13 36 14C36 17 32 18 30 18" stroke="#475569" stroke-width="2" />
      </g>
      <!-- Label -->
      <rect x="38" y="318" width="89" height="26" rx="8" fill="#FFFFFF" />
      <text x="82" y="331" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#0F172A">Kelas 7-A</text>
      <text x="82" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#2563EB">98.7% Tepat</text>
    </g>

    <!-- 1st Place Podium (Center - Gold) -->
    <g id="PodiumGold">
      <rect x="142" y="200" width="106" height="155" rx="16" fill="url(#goldGrad)" />
      <!-- Top Cap Highlight -->
      <path d="M142 210 C142 204, 146 200, 152 200 L238 200 C244 200, 248 204, 248 210 L248 215 L142 215 Z" fill="#FFFFFF" opacity="0.5" />
      <text x="195" y="275" text-anchor="middle" font-family="Inter, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" opacity="0.7">1</text>
      
      <!-- Gold Trophy Cup with Crown -->
      <g transform="translate(175, 145)">
        <ellipse cx="20" cy="32" rx="14" ry="4" fill="#854D0E" opacity="0.3" />
        <path d="M10 32L30 32M20 22L20 32M8 10C8 19 15 23 20 23C25 23 32 19 32 10H8Z" fill="#FACC15" stroke="#CA8A04" stroke-width="2.5" />
        <path d="M8 13H3C2 13 1 15 1 17C1 21 6 22 8 22" stroke="#CA8A04" stroke-width="2.5" />
        <path d="M32 13H37C38 13 39 15 39 17C39 21 34 22 32 22" stroke="#CA8A04" stroke-width="2.5" />
        <!-- Star Icon on Trophy -->
        <polygon points="20,12 21.5,15.5 25,15.5 22,17.5 23,21 20,19 17,21 18,17.5 15,15.5 18.5,15.5" fill="#FFFFFF" />
      </g>
      <!-- Label -->
      <rect x="150" y="308" width="90" height="36" rx="10" fill="#FFFFFF" />
      <text x="195" y="323" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#023C69">Kelas 8-B</text>
      <text x="195" y="337" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#16A34A">★ 99.4% Juara 1</text>
    </g>

    <!-- 3rd Place Podium (Right - Bronze) -->
    <g id="PodiumBronze">
      <rect x="255" y="255" width="105" height="100" rx="16" fill="url(#bronzeGrad)" />
      <!-- Top Cap Highlight -->
      <path d="M255 265 C255 259, 259 255, 265 255 L350 255 C356 255, 360 259, 360 265 L360 270 L255 270 Z" fill="#FFFFFF" opacity="0.4" />
      <text x="307" y="315" text-anchor="middle" font-family="Inter, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" opacity="0.6">3</text>
      
      <!-- Bronze Trophy Cup -->
      <g transform="translate(287, 210)">
        <ellipse cx="20" cy="26" rx="9" ry="3" fill="#7C2D12" opacity="0.3" />
        <path d="M12 26L28 26M20 18L20 26M10 8C10 15 16 19 20 19C24 19 30 15 30 8H10Z" fill="#F97316" stroke="#9A3412" stroke-width="2" />
        <path d="M10 11H6C5 11 4 13 4 14C4 16 8 17 10 17" stroke="#9A3412" stroke-width="2" />
        <path d="M30 11H34C35 11 36 13 36 14C36 16 32 17 30 17" stroke="#9A3412" stroke-width="2" />
      </g>
      <!-- Label -->
      <rect x="263" y="323" width="89" height="24" rx="8" fill="#FFFFFF" />
      <text x="307" y="335" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#0F172A">Kelas 9-C</text>
      <text x="307" y="343" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#EA580C">97.9% Tepat</text>
    </g>
  </g>

  <!-- Section Title -->
  <text x="24" y="390" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F172A">Peringkat Lainnya</text>
  <text x="366" y="390" text-anchor="end" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2563EB">Lihat Semua (32)</text>

  <!-- RANKING LIST -->
  <!-- Card Rank 4 -->
  <g id="Rank4" transform="translate(20, 404)" filter="url(#cardShadow)">
    <rect width="350" height="64" rx="16" fill="#FFFFFF" />
    <text x="24" y="38" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#64748B">#4</text>
    
    <rect x="52" y="14" width="36" height="36" rx="10" fill="#EFF6FF" />
    <text x="70" y="37" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#2563EB">7-B</text>
    
    <text x="100" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Kelas VII-B</text>
    <text x="100" y="46" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B">31 Siswa • 96.8% Kehadiran</text>

    <!-- Streak Badge -->
    <rect x="270" y="20" width="66" height="24" rx="12" fill="#FFF7ED" />
    <text x="303" y="36" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#EA580C">🔥 16 Hari</text>
  </g>

  <!-- Card Rank 5 -->
  <g id="Rank5" transform="translate(20, 478)" filter="url(#cardShadow)">
    <rect width="350" height="64" rx="16" fill="#FFFFFF" />
    <text x="24" y="38" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#64748B">#5</text>
    
    <rect x="52" y="14" width="36" height="36" rx="10" fill="#F0FDF4" />
    <text x="70" y="37" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#16A34A">8-A</text>
    
    <text x="100" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Kelas VIII-A</text>
    <text x="100" y="46" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B">32 Siswa • 95.4% Kehadiran</text>

    <!-- Streak Badge -->
    <rect x="270" y="20" width="66" height="24" rx="12" fill="#FFF7ED" />
    <text x="303" y="36" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#EA580C">🔥 12 Hari</text>
  </g>

  <!-- Card Rank 6 -->
  <g id="Rank6" transform="translate(20, 552)" filter="url(#cardShadow)">
    <rect width="350" height="64" rx="16" fill="#FFFFFF" />
    <text x="24" y="38" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#64748B">#6</text>
    
    <rect x="52" y="14" width="36" height="36" rx="10" fill="#FAF5FF" />
    <text x="70" y="37" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#9333EA">9-A</text>
    
    <text x="100" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Kelas IX-A</text>
    <text x="100" y="46" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B">30 Siswa • 94.1% Kehadiran</text>

    <!-- Streak Badge -->
    <rect x="270" y="20" width="66" height="24" rx="12" fill="#FFF7ED" />
    <text x="303" y="36" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#EA580C">🔥 8 Hari</text>
  </g>

  <!-- My Class Sticky Floating Ribbon -->
  <g id="MyClassRibbon" transform="translate(20, 630)" filter="url(#cardShadow)">
    <rect width="350" height="56" rx="16" fill="url(#primaryGrad)" />
    <circle cx="36" cy="28" r="14" fill="#FFFFFF" opacity="0.2" />
    <text x="36" y="33" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">#1</text>
    <text x="60" y="27" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Kelas Kamu (8-B) Memimpin!</text>
    <text x="60" y="41" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#BAE6FD">Pertahankan besok untuk juara piala bergilir</text>
    <text x="325" y="34" text-anchor="end" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#FDE047">🏆 99.4%</text>
  </g>

  <!-- BOTTOM NAVIGATION BAR -->
  <g id="BottomNavBar" transform="translate(0, 754)">
    <rect width="390" height="90" fill="#FFFFFF" filter="url(#cardShadow)" />
    
    <!-- Home Tab -->
    <g transform="translate(65, 14)">
      <path d="M12 3L3 10V20C3 20.5 3.5 21 4 21H20C20.5 21 21 20.5 21 20V10L12 3Z" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="12" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Beranda</text>
    </g>

    <!-- Leaderboard Tab (Active) -->
    <g transform="translate(195, 14)">
      <rect x="-24" y="-4" width="48" height="32" rx="16" fill="#EFF6FF" />
      <path d="M-6 16V4M0 16V-2M6 16V8" stroke="#023C69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#023C69">Peringkat</text>
    </g>

    <!-- Profile Tab -->
    <g transform="translate(325, 14)">
      <path d="M4 21V19C4 16.8 5.8 15 8 15H16C18.2 15 20 16.8 20 19V21M12 11C9.8 11 8 9.2 8 7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7C16 9.2 14.2 11 12 11Z" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="12" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Profil</text>
    </g>
  </g>
</svg>
